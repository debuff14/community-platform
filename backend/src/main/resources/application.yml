server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: community-platform
  # 本地敏感配置（数据库密码等）放在 application-local.yml，该文件不入库
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

community:
  jwt:
    secret: community-platform-jwt-secret-key-please-change-this-in-production-2026
    expire-hours: 24
  bill:
    cron:
      generate: "0 0 0 1 * ?"
      remind: "0 0 0 14 * ?"
